<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FinanceTracker - Personal Wealth & Cash Flow Management">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FinanceTracker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FinanceTracker</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0B0F19 0%, #1E1B4B 40%, #312E81 70%, #4C1D95 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #loading-splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-container {
      width: 90px;
      height: 90px;
      background: #ffffff;
      border-radius: 50%;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4), 0 0 60px rgba(139, 92, 246, 0.2);
      animation: pulseLogo 2s infinite ease-in-out;
    }
    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .app-title {
      color: #ffffff;
      font-size: 28px;
      font-weight: 800;
      margin-top: 24px;
      letter-spacing: -0.5px;
    }
    .app-tagline {
      color: #A5B4FC;
      font-size: 13px;
      margin-top: 6px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .spinner {
      margin-top: 36px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #818CF8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="logo-container">
      <img src="favicon.png" alt="FinanceTracker Logo" class="logo-img" />
    </div>
    <div class="app-title">FinanceTracker</div>
    <div class="app-tagline">Personal Wealth & Cash Flow Management</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
